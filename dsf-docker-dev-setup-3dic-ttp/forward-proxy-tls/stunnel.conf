foreground = yes
debug = info

[tinyproxy]
accept = 8443
connect = forward-proxy:8080

cert = /run/secrets/forward-proxy-tls.chain.crt
key = /run/secrets/forward-proxy-tls.key.plain

sslVersionMin = TLSv1.2